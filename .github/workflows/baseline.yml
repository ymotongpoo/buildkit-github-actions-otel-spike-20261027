name: BuildKit baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.29.1
          install: true
      - name: Configure Cloud builder
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GRAFANA_CLOUD_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GRAFANA_CLOUD_OTLP_HEADERS }}
        run: bash scripts/setup-builder.sh
      - name: Build Docker image
        env:
          OTEL_RESOURCE_ATTRIBUTES: vcs.ref.head.revision=${{ github.sha }},ci.run.id=${{ github.run_id }},ci.repository=${{ github.repository }},experiment.mode=baseline
        run: docker buildx build --builder ci-otel --load --tag buildkit-otel-spike:ci .
      - name: Test Docker image
        run: test "$(docker run --rm buildkit-otel-spike:ci)" = "hello from GitHub Actions"
      - name: Record versions
        run: |
          docker version --format '{{.Server.Version}}'
          docker buildx version
          printf 'Run: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove Cloud builder
        if: always()
        run: docker buildx rm ci-otel || true
