name: BuildKit linked trace
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.29.1
          install: true
      - name: Configure Cloud builder
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GRAFANA_CLOUD_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GRAFANA_CLOUD_OTLP_HEADERS }}
        run: bash scripts/setup-builder.sh
      - name: Calculate build step parent
        id: build_context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-parent.py
      - name: Build Docker image
        env:
          TRACEPARENT: ${{ steps.build_context.outputs.traceparent }}
          OTEL_RESOURCE_ATTRIBUTES: vcs.ref.head.revision=${{ github.sha }},ci.run.id=${{ github.run_id }},ci.run.attempt=${{ github.run_attempt }},ci.repository=${{ github.repository }},experiment.mode=linked
        run: docker buildx build --builder ci-otel --load --tag buildkit-otel-spike:ci .
      - name: Test Docker image
        run: test "$(docker run --rm buildkit-otel-spike:ci)" = "hello from GitHub Actions"
      - name: Remove Cloud builder
        if: always()
        run: docker buildx rm ci-otel || true
  verify-source:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify source fixture
        run: test "$(cat message.txt)" = "hello from GitHub Actions"
